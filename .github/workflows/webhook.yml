name: Webhook Update Portal-EOL Image

on:
  workflow_call:
  repository_dispatch:
    types: [debug-webhook]

jobs:
  webhook:
    runs-on: ubuntu-latest
    if: ${{ github.event_name }} == 'workflow_call' || ${{ github.event.client_payload.debug }}
    steps:
      - name: Create GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.EOLITO_BOT_APP_ID }}
          private-key: ${{ secrets.EOLITO_BOT_PRIVATE_KEY }}

      - name: Trigger second repository
        run: |
          curl --fail-with-body -X POST -H "Authorization: Bearer ${{ steps.app_token.outputs.token }}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" https://api.github.com/repos/eol-uchile/argocd-config/dispatches --data '{"event_type": "update-portal", "client_payload": {"type": "portal"}}'
